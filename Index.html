<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Padel Turneringstræ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Padel Doubler – 8 par</h1>

<section class="panel">
  <h2>Importér data fra Excel</h2>
  <p class="hint">
    Indsæt 16 linjer i formatet:<br>
    Fornavn[TAB]Efternavn[TAB]Rankedin[TAB]PadelLink
  </p>
  <textarea id="importData" placeholder="Indsæt data her..." rows="10"></textarea>
  <button onclick="importTeams()">Importér</button>
</section>

<section class="panel">
  <h2>Tilføj par manuelt</h2>
  <div class="pair-form">
    <div class="pair-form-player">
      <strong>Spiller 1</strong>
      <input type="text" id="p1Name" placeholder="Navn *" required>
      <input type="text" id="p1Rankedin" placeholder="Rankedin (valgfri)">
      <input type="text" id="p1PadelLink" placeholder="PadelLink niveau (valgfri)">
    </div>
    <div class="pair-form-player">
      <strong>Spiller 2</strong>
      <input type="text" id="p2Name" placeholder="Navn *" required>
      <input type="text" id="p2Rankedin" placeholder="Rankedin (valgfri)">
      <input type="text" id="p2PadelLink" placeholder="PadelLink niveau (valgfri)">
    </div>
  </div>
  <button onclick="addPairManually()">Tilføj par</button>
</section>

<section class="panel">
  <h2>Seedings (drag & drop)</h2>
  <ul id="teamList" class="team-list"></ul>
</section>

<section class="panel">
  <h2>Turneringstræ</h2>

  <div class="controls">
    <label for="scaleRange">Antal par:</label>
    <input id="scaleRange" type="range" min="4" max="16" step="4" value="8" oninput="updateScale(this.value)">
    <span id="scaleValue">8 par</span>
    <button onclick="generateBracket()">Generér bracket</button>
  </div>

  <div id="bracketWrapper">
    <div id="bracket" class="bracket"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
